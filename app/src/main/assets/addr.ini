; 인천국제공항공사_여객편 주간 운항 현황(15095074). 관심목록 없음(조회 전용,
; 타이머 알림 없음) - airport_code 없이 부르면 하루치만도 약 1,200건이라
; FlowMessageRouter가 응답을 받는 즉시 오늘 날짜로 거르고 상위 5건 +
; 집계(오늘전체/오늘지연/오늘결항)만 남겨 엔진에 넘긴다(net/FlowMessageRouter.kt
; compactIcnResponseIfNeeded 참고 - 이 DSL 엔진의 처리:: 재귀 200회 상한 때문에
; 불가피한 예외).
