; 건강보험심사평가원 병원정보서비스(getHospBasisList) - 지역 내 병원
; 목록+요양기호(ykiho) 조회. 관심목록 없음(조회 전용) - sidoCd(시도코드)/
; sgguCd(시군구코드)가 법정동코드와 같은 체계일 거라 보고 lawd_codes.db
; 재사용을 시도했다가, 실기기 조회 결과 totalCount=0으로 틀렸음을 확인
; (2026-10-10). opendata.hira.or.kr 코드조회에서 직접 확인한 심평원 자체
; 6자리 지역코드(예: 강남구=110001)를 쓰는 전용 hira_region_codes.db로
; 교체했다(HiraRegionCodeStore.kt 참고) - 법정동코드와는 무관한 체계.
; sidoCd 파라미터는 일부러 안 보낸다 - sgguCd만으로도 전국 유일값인데,
; 실기기 테스트에서 sidoCd를 같이 보내면 오히려 totalCount=0이 됨을 확인.
[HIRA]
domain=https://apis.data.go.kr/B551182/hospInfoServicev2
label=병원(HIRA)
apply_url=https://www.data.go.kr/data/15001698/openapi.do
health_check_path=/getHospBasisList?ServiceKey={KEY}&sgguCd=110001&numOfRows=1&pageNo=1&_type=json

; 건강보험심사평가원 의료기관별상세정보서비스(getDtlInfo2.8) - 위 HIRA에서
; 받은 ykiho 하나당 요일별 진료시간/야간진료여부를 조회하는 2차 호출 전용
; 섹션. label/apply_url을 일부러 안 둬서 "서비스별 활용신청" 목록에는 안
; 뜨게 했다 - 실제 활용신청은 HIRA와 별개로 이미 했지만(15001699), 사용자
; 입장에서는 "병원" 기능 하나일 뿐이라 설정 화면에 중복으로 보일 필요가
; 없다(ServiceCatalogStore는 label/apply_url 둘 다 있는 섹션만 집계함).
; serviceKey 파라미터명이 HIRA와 다르게 소문자인 것도 data.go.kr에서 직접
; 확인한 사실(추측 아님).
[HIRA_DETAIL]
domain=https://apis.data.go.kr/B551182/MadmDtlInfoService2.8
