; phoneFlow 공공데이터 6종(KRX/KMA/KECO/KMA_SPCD/MOLIT/ICN) 실기기 검증용 addr.ini.
; ⚠️ 테스트 중에는 NotebookFlow-release/NotebookFlow/addr.ini의 실제 공공데이터
; 포털 서비스키를 임시로 채워 넣어 실측하되, 검증이 끝나면 반드시 아래 전부를
; <여기에 입력하세요> 형태의 빈 템플릿으로 되돌린다(결과보고 전 필수 작업).

; 공공데이터포털(data.go.kr)은 회원가입 시 "일반 인증키" 하나만 발급하고,
; 개별 API(KRX/KMA/KECO/KMA_SPCD/MOLIT/ICN)는 그 키로 "활용신청"만 추가하면
; 됩니다 - 아래 6개 서비스는 전부 이 키 하나를 공유합니다.
[K_DATA]
service_key=<여기에 입력하세요>

[KRX]
domain=https://apis.data.go.kr/1160100/GetStockSecuritiesInfoService_V2
threshold=5

[KRX_WATCHLIST]
; 종목1=삼성전자:005930 형태로 최대 5개까지(종목1~종목5) 초기 시드를 등록할 수 있습니다.
; 앱 시작(엔진 bootStrap의 "시작" 이벤트) 시 1회만 읽혀 세션의 관심종목 목록을
; 초기화하며, "주식 관심종목 추가/삭제" 채팅 명령이 함수.설정저장(SETINI)을 통해
; 이 섹션에 실제로 영구 반영됩니다(값이 "없음"이면 빈 슬롯).
종목1=삼성전자:005930
종목2=없음
종목3=없음
종목4=없음
종목5=없음

[KMA]
domain=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
threshold=60
alert_hour=07
default_region=서울

[KMA_WATCHLIST]
; 지역1=서울 형태로 최대 5개까지(지역1~지역5) 초기 관심지역 시드를 등록할 수 있습니다.
; 지원 지역명(격자좌표는 rest.sce의 처리::KMA.KMA지역좌표확인에 하드코딩):
; 서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 수원, 제주
지역1=서울
지역2=없음
지역3=없음
지역4=없음
지역5=없음

[KECO]
domain=https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
alert_hour=07
default_region=서울

[KECO_WATCHLIST]
; 지역1=서울 형태로 최대 5개까지(지역1~지역5) 초기 관심지역 시드를 등록할 수 있습니다.
; 지원 지역명(에어코리아 시도명 17개, rest.sce의 처리::KECO.KECO지역명검증/
; KECO지역확인에 하드코딩):
; 서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기, 강원, 충북, 충남,
; 전북, 전남, 경북, 경남, 제주
지역1=서울
지역2=없음
지역3=없음
지역4=없음
지역5=없음

[KMA_SPCD]
domain=https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
alert_hour=21

[MOLIT]
domain=https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade
default_region_name=강남구
default_region_code=11680

[MOLIT_WATCHLIST]
지역1=강남구:11680
지역2=없음
지역3=없음
지역4=없음
지역5=없음

; 인천국제공항공사_여객편 주간 운항 현황(15095074). 관심목록 없음(조회 전용,
; 타이머 알림 없음) - airport_code 없이 부르면 하루치만도 약 1,200건이라
; FlowMessageRouter가 응답을 받는 즉시 오늘 날짜로 거르고 상위 5건 +
; 집계(오늘전체/오늘지연/오늘결항)만 남겨 엔진에 넘긴다(net/FlowMessageRouter.kt
; compactIcnResponseIfNeeded 참고 - 이 DSL 엔진의 처리:: 재귀 200회 상한 때문에
; 불가피한 예외).
[ICN]
domain=https://apis.data.go.kr/B551177/StatusOfPassengerFlightsDSOdp
