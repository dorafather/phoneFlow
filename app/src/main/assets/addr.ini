; 관심목록 없음(조회 전용) - 법정동 시도/시군구코드(lDongRegnCd/
; lDongSignguCd)를 쓰는데, MOLIT 법정동코드의 앞 2자리+다음 3자리와
; 정확히 같은 체계라 새 데이터셋 없이 기존 lawd_codes.db를 재사용한다.
[TOUR]
