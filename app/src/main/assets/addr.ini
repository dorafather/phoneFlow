; phoneFlow 공공데이터 6종(KRX/KMA/KECO/KMA_SPCD/MOLIT/ICN) 실기기 검증용 addr.ini.
; ⚠️ 테스트 중에는 NotebookFlow-release/NotebookFlow/addr.ini의 실제 공공데이터
; 포털 서비스키를 임시로 채워 넣어 실측하되, 검증이 끝나면 반드시 아래 전부를
; <여기에 입력하세요> 형태의 빈 템플릿으로 되돌린다(결과보고 전 필수 작업).

; 공공데이터포털(data.go.kr)은 회원가입 시 "일반 인증키" 하나만 발급하고,
; 개별 API(KRX/KMA/KECO/KMA_SPCD/MOLIT/ICN)는 그 키로 "활용신청"만 추가하면
; 됩니다 - 아래 6개 서비스는 전부 이 키 하나를 공유합니다.
[K_DATA]
service_key=<여기에 입력하세요>

[KRX]
domain=https://apis.data.go.kr/1160100/GetStockSecuritiesInfoService_V2
threshold=5
label=주식(KRX)
apply_url=https://www.data.go.kr/data/15094808/openapi.do
health_check_path=/getStockPriceInfo_V2?serviceKey={KEY}&resultType=json&numOfRows=1&pageNo=1&likeSrtnCd=005930

[KRX_WATCHLIST]
; 종목1=삼성전자:005930 형태로 최대 5개까지(종목1~종목5) 초기 시드를 등록할 수 있습니다.
; 앱 시작(엔진 bootStrap의 "시작" 이벤트) 시 1회만 읽혀 세션의 관심종목 목록을
; 초기화하며, "주식 관심종목 추가/삭제" 채팅 명령이 함수.설정저장(SETINI)을 통해
; 이 섹션에 실제로 영구 반영됩니다(값이 "없음"이면 빈 슬롯).
종목1=삼성전자:005930
종목2=없음
종목3=없음
종목4=없음
종목5=없음

