org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# 저장소 경로(C:\changwoon\개인자료\DSL\...)에 비-ASCII(한글) 문자가 포함돼
# 있어 AGP가 기본적으로 빌드를 거부한다(http://b.android.com/95744).
# 저장소 위치를 바꿀 수 없으므로(업무지침서 고정 경로) 공식 오버라이드
# 플래그로 경고만 끈다 - 실제 네이티브(CMake/Ninja) 빌드 단계에서 한글
# 경로가 문제를 일으키는지는 별도로 실측 확인 필요(과거 nats.c Windows
# 빌드에서 CMake+NMake 한글 경로 depfile 크래시 전례가 있었음).
android.overridePathCheck=true
